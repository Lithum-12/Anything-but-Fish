plugins {
    id 'fabric-loom' version '0.10-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Aliyun mirror for faster downloads in China
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }

    // Fabric Maven
    maven { url 'https://maven.fabricmc.net/' }

    // Shedaniel Maven – hosts Cloth Config API
    maven { url 'https://maven.shedaniel.me/' }

    // ModMenu is hosted on Terraformers Maven
    maven { url = "https://maven.terraformersmc.com/releases" }
}

dependencies {
    // Minecraft + Yarn mappings (MC 1.16.5)
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.minecraft_version}+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Cloth Config API 4.x – compile + dev runtime, NOT bundled
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // ModMenu 1.x – full dependency (needed at compile time for ModMenuApi interface)
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

// Compile target: Java 8 bytecode (MC 1.16.5 players need Java 8)
// Compiler: Java 17 javac with --release 8 (restricts API to Java 8)
def targetJavaVersion = 8
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    // Java 17 toolchain runs Gradle + Loom + javac
    // --release 8 above ensures Java 8 bytecode output
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}