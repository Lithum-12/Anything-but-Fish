plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Aliyun mirror for faster downloads in China
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    // Fabric Maven
    maven { url 'https://maven.fabricmc.net/' }
    // Xander Maven – hosts YetAnotherConfigLib
    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
    // ModMenu is hosted on Terraformers Maven
    maven { url = "https://maven.terraformersmc.com/releases" }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Use Mojang mappings for all versions
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API – dev environment only, not required at runtime
    modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"    // ← 改：modImplementation → modLocalRuntime

    // YetAnotherConfigLib – optional at runtime, required at compile time for the GUI code
    modCompileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
    modLocalRuntime "dev.isxander:yet-another-config-lib:${project.yacl_version}"

    // ModMenu – optional at runtime, compile-only for the ModMenuApi interface
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"             // ← 改：硬编码 → 属性
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"            // ← 改：硬编码 → 属性

    // Fix: YACL's TwelveMonkeys WebP SPI missing in dev environment
    modLocalRuntime "com.twelvemonkeys.imageio:imageio-webp:3.11.0"                    // ← 新增
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}