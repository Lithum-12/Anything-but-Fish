plugins {
    // NOTE: Fabric Loom 1.12+ disables Mixin AP by default; refmap not generated, runtime warning is harmless.
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    // Xander Maven – hosts YetAnotherConfigLib
    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
    // ModMenu is hosted on Terraformers Maven
    maven { url = "https://maven.terraformersmc.com/releases" }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Fabric API – optional at runtime, required at compile time for the API classes
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // YetAnotherConfigLib – optional at runtime, required at compile time for the GUI code
    // Players who don't have YACL installed will still work fine (JSON config only)
    modCompileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
    // Make YACL available in runClient/runServer dev environments
    modLocalRuntime "dev.isxander:yet-another-config-lib:${project.yacl_version}"

    // ModMenu – optional at runtime, compile-only for the ModMenuApi interface
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    // ModMenu dev runtime for MC 1.21.1
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}